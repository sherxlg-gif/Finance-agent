name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        env:
          DASHSCOPE_API_KEY: ci-dummy-key
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react-v2/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: >-
          npm run lint --
          --rule "@typescript-eslint/no-unused-vars: off"
          --rule "react-hooks/set-state-in-effect: off"

      - name: Build frontend
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          DASHSCOPE_API_KEY: ci-dummy-key
          API_SECRET_KEY: ci-dummy-secret
        run: docker compose config --quiet
